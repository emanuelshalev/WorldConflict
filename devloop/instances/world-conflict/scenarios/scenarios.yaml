# Scenarios in each customer's own words. Version 1.0 (estimated from rounds 1-3 and RS-001).
# Refined after every iteration: add what personas tried that is missing, retire what no one cares about.

maya:
  - {id: M1, goal: "I have 15 minutes on the train. I want to play today's crisis and know at the end whether I did well and why."}
  - {id: M2, goal: "I want to finish a whole Flashpoint without getting stuck on something I don't understand."}
olivia:
  - {id: O1, goal: "My friend sent me this link. I want to start playing right away and have fun in the first two minutes."}
  - {id: O2, goal: "I want to do something big, like make peace or stop a war, and see it happen."}
sam:
  - {id: S1, goal: "I want to judge in five minutes whether this is a crafted game or an AI-made dashboard."}
  - {id: S2, goal: "I want to do the same action from the map and from the menus and see if they work the same."}
dan:
  - {id: D1, goal: "I want to play a full term as a tough country and understand every rule that limits me."}
  - {id: D2, goal: "I want to find the best strategy and check whether there is one move that always wins."}
priya:
  - {id: P1, goal: "I want to play the Ukraine ceasefire crisis as Ukraine and see if the world reacts like the real one."}
  - {id: P2, goal: "I want to understand what each choice is meant to achieve before I take it, and learn what really happened."}
leo:
  - {id: L1, goal: "I'm live on stream. I want the most dramatic run possible and an end screen my chat will love."}
  - {id: L2, goal: "I want to try crazy moves (war, nukes, coups) and either see them happen or get a clear, showable reason why not."}
ruth:
  - {id: R1, goal: "I read about the Ukraine ceasefire talks this morning. I want to try being in charge and see whether my choices would have ended it, and read what really happened."}
  - {id: R2, goal: "I have the afternoon. I want to play a whole term at my own pace without having to figure out a video game."}
noah:
  - {id: N1, goal: "My teacher said this game is about real wars. I want to start in seconds on my phone and do something huge."}
  - {id: N2, goal: "I want a result I can screenshot and show my friends."}
marcus:
  - {id: K1, goal: "I want to replay the same crisis twice with opposite choices and see whether the outcomes differ for reasons I can follow."}
  - {id: K2, goal: "I want a long 1990 campaign and to check that the world behaves like it plausibly could have."}

# Control scenarios (D-59): the same seat and seed every iteration, on the anchor device, so
# iterations compare like with like. Start them with the seed code under "Play a seed" on the title screen.
control:
  maya:   {code: CO-UKR-MAYA1,    device: phone,   play: "Flashpoint to the end (12 months)"}
  olivia: {code: CA-USA-OLIV1,    device: laptop,  play: "Flashpoint, as far as she would"}
  ruth:   {code: CO-UKR-RUTH1,    device: tablet,  play: "Flashpoint to the end (12 months)"}
  noah:   {code: HC-ARE-NOAH1,    device: phone,   play: "Flashpoint, as far as he would"}
  priya:  {code: CO-UKR-PRIY1,    device: laptop,  play: "Flashpoint to the end (12 months)"}
  dan:    {code: T2026-RUS-DAN01, device: desktop, play: "One Term, at least 12 months"}
  sam:    {code: SL-CHN-SAM01,    device: desktop, play: "Flashpoint, as far as he would"}
  leo:    {code: QU-CHN-LEO01,    device: desktop, play: "Flashpoint to the end (12 months)"}
  marcus: {code: T1990-USA-MARC1, device: desktop, play: "One Term, at least 12 months"}
