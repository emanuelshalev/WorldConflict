<style>
/* House tokens (ui/src/styles/wc.css) */
:root {
  --bg-0: #0b0f17; --ocean: #0e1a2b; --land: #1f2a3a; --surface-1: #141b27; --surface-2: #1c2533; --surface-3: #243042;
  --line: #2a3546; --line-2: #3a4759; --text-1: #e8ecf2; --text-2: #a3aebf; --text-3: #8693a6;
  --accent: #f2a93b; --accent-ink: #1b1204; --ally: #3d8bfd; --rival: #f26b3a; --war: #e5383b; --nuke: #f5d547; --good: #56c596;
  --font-ui: 'Geist', 'Inter', system-ui, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
  --font-news: 'Instrument Serif', Georgia, serif; --font-serif: 'Newsreader', Georgia, serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05080f; color: var(--text-1); font-family: var(--font-ui); font-size: 15px; }
button { font: inherit; color: inherit; }
.ts2 { position: fixed; inset: 0; overflow: hidden; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.era-ink { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 70% at 40% 50%, rgba(214, 170, 110, 0) 40%, rgba(214, 170, 110, .55) 100%); mix-blend-mode: soft-light; opacity: 0; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(5,8,15,.8) 0%, rgba(5,8,15,0) 30%, rgba(5,8,15,0) 62%, rgba(5,8,15,.6) 100%), linear-gradient(180deg, rgba(5,8,15,.75) 0%, rgba(5,8,15,0) 16%, rgba(5,8,15,0) 88%, rgba(5,8,15,.8) 100%); }
.top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 22px 36px 0; z-index: 3; }
.brand h1 { margin: 0; font-family: var(--font-news); font-weight: 400; font-size: 50px; line-height: 1; }
.brand .when { margin-top: 8px; font-size: 15px; color: var(--accent); font-weight: 600; }
.brand .when .yr { font-family: var(--font-mono); }
.status { display: flex; gap: 16px; margin-top: 10px; color: var(--text-2); font-size: 15px; }
.status b { color: var(--text-1); font-family: var(--font-mono); }
.actions { display: flex; gap: 10px; align-items: flex-start; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(20,27,39,.8); display: grid; place-items: center; }
.ghost { height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: none; color: var(--text-2); font-size: 15px; }
.left { position: absolute; left: 36px; top: 168px; width: 360px; z-index: 3; }
.dial { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 5px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(12,17,28,.86); }
.dial button { border: 0; background: none; border-radius: 10px; padding: 8px 10px; text-align: left; color: var(--text-2); }
.dial button small { display: block; font-size: 13px; color: var(--text-3); }
.dial button b { font-size: 15px; }
.dial button.on { background: var(--accent); color: var(--accent-ink); }
.dial button.on small { color: rgba(27,18,4,.75); }
.pitch { color: var(--text-2); line-height: 1.45; margin: 14px 0 0; }
.tag { font-family: var(--font-news); font-weight: 400; font-size: 44px; line-height: 1.02; margin: 18px 0 0; }
.tag em { color: var(--accent); }
.dossier { position: absolute; right: 16px; top: 120px; bottom: 16px; width: 420px; z-index: 4; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: rgba(12,17,28,.92); border: 1px solid var(--line-2); box-shadow: 0 20px 60px rgba(0,0,0,.55); overflow: hidden; }
.label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.eras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.eras button { border: 1px solid var(--line-2); background: var(--surface-1); border-radius: 10px; padding: 8px 6px 7px; text-align: left; min-height: 60px; }
.eras button b { display: block; font-family: var(--font-mono); font-size: 17px; }
.eras button span { display: block; font-size: 13px; color: var(--text-2); line-height: 1.2; margin-top: 2px; }
.eras button.on { border-color: var(--accent); background: rgba(242,169,59,.12); }
.eras button.on b { color: var(--accent); }
.desc { margin: 0; font-family: var(--font-serif); font-size: 16px; line-height: 1.4; }
.fires { display: flex; flex-direction: column; gap: 4px; }
.fire { display: grid; grid-template-columns: 22px 26px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--line); }
.fire.on { border-color: var(--accent); }
.fire .n { font-family: var(--font-mono); color: var(--text-2); font-size: 14px; text-align: center; }
.fire b { font-size: 15px; display: block; }
.fire small { font-size: 13px; color: var(--text-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.switch { width: 34px; height: 20px; border-radius: 10px; background: var(--surface-3); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-2); }
.sides { display: flex; flex-direction: column; gap: 6px; }
.side { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--line); }
.side.on { border-color: var(--accent); background: rgba(242,169,59,.08); }
.side i { width: 10px; height: 26px; border-radius: 3px; }
.side b { font-size: 15px; }
.side small { display: block; font-size: 13px; color: var(--text-2); }
.side .alt { font-size: 13px; color: var(--accent); }
.spacer { flex: 1; }
.go { height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; }
.key { position: absolute; left: 36px; bottom: 16px; z-index: 4; max-width: 640px; padding: 10px 12px; border-radius: 14px; background: rgba(12,17,28,.9); border: 1px solid var(--line-2); font-size: 13px; }
.key h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.key .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.key .row + h4 { margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--text-1); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--line); gap: 2px; }
.seg span { padding: 4px 10px; border-radius: 7px; color: var(--text-2); font-weight: 500; }
.seg span.on { background: var(--surface-3); color: var(--text-1); }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.ramp { display: inline-flex; border-radius: 4px; overflow: hidden; }
.ramp i { width: 22px; height: 12px; }
.ln { width: 26px; height: 0; border-top: 2.5px solid; display: inline-block; }
.card { position: absolute; z-index: 5; width: 330px; padding: 14px; border-radius: 14px; background: rgba(16,22,34,.97); border: 1px solid var(--line-2); box-shadow: 0 16px 50px rgba(0,0,0,.6); display: none; }
.card .kick { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.card h3 { margin: 6px 0 4px; font-family: var(--font-serif); font-weight: 600; font-size: 21px; line-height: 1.2; }
.card p { margin: 0 0 10px; color: var(--text-2); line-height: 1.4; }
.card .who { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.card .who div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.card .who i { width: 10px; height: 22px; border-radius: 3px; }
.card .who b { font-size: 15px; }
.card .who small { display: block; color: var(--text-2); font-size: 13px; }
.card .stab { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); }
.card .cta { display: flex; gap: 6px; flex-wrap: wrap; }
.card .cta button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 600; font-size: 14px; }
.card .cta button.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.card.docked { position: static; width: auto; box-shadow: none; background: var(--surface-1); border-color: var(--accent); padding: 12px; }
.card.docked h3 { font-size: 19px; margin: 4px 0; }
.card.docked p { margin-bottom: 8px; }
.dossier:has(.docked) .fire small { display: none; }
.dossier:has(.docked) .fire { padding: 4px 8px; }
.tip { position: absolute; z-index: 5; padding: 9px 11px; border-radius: 10px; background: rgba(16,22,34,.97); border: 1px solid var(--line-2); font-size: 13px; color: var(--text-2); display: none; max-width: 270px; line-height: 1.4; }
.tip b { color: var(--text-1); font-size: 15px; display: block; }
.yearstamp { position: absolute; z-index: 2; pointer-events: none; font-family: var(--font-news); font-size: 150px; line-height: 1; color: rgba(255, 236, 205, .9); text-shadow: 0 0 40px rgba(242,169,59,.45); opacity: 0; transform: translate(-50%, -50%); letter-spacing: .02em; }
.phone-eras, .phone-fires { display: none; }
.badge { position: absolute; right: 16px; bottom: 16px; z-index: 6; font-size: 13px; color: var(--text-3); }

/* Phone (390): globe band on top, era chips under it, dossier below */
@media (max-width: 700px) {
  .ts2 { position: relative; overflow: visible; min-height: 100%; }
  #globe { position: absolute; top: 0; height: 600px; }
  .vignette { height: 600px; background: linear-gradient(180deg, rgba(5,8,15,.85) 0%, rgba(5,8,15,0) 22%, rgba(5,8,15,0) 82%, rgba(5,8,15,1) 100%); }
  .era-ink { height: 600px; }
  .top { padding: 14px 16px 0; }
  .brand h1 { font-size: 30px; }
  .brand .when { font-size: 13px; margin-top: 4px; }
  .status { gap: 10px; font-size: 13px; margin-top: 6px; }
  .actions .ghost { display: none; }
  .left { left: 16px; right: 16px; top: 112px; width: auto; }
  .pitch, .tag { display: none; }
  .dial button { padding: 6px 8px; }
  .phone-eras { display: flex; position: absolute; left: 16px; right: 16px; top: 552px; z-index: 4; gap: 6px; }
  .phone-eras button { flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(20,27,39,.92); font-family: var(--font-mono); font-size: 16px; font-weight: 600; }
  .phone-eras button.on { border-color: var(--accent); color: var(--accent); background: rgba(40,30,12,.95); }
  .phone-fires { display: flex; position: absolute; left: 0; right: 0; top: 606px; z-index: 4; gap: 8px; overflow: hidden; padding: 0 16px; }
  .phone-fires .fire { flex: none; width: 236px; }
  .dossier { position: absolute; top: 668px; left: 10px; right: 10px; width: auto; bottom: auto; min-height: 520px; }
  .dossier .eras, .dossier .fires, .dossier .more, .dossier .label.e { display: none; }
  .key { left: 16px; right: 16px; bottom: auto; top: 506px; max-width: none; padding: 6px 10px; background: rgba(12,17,28,.85); }
  .key .full { display: none; }
  .card { left: 10px !important; right: 10px; width: auto !important; top: auto !important; bottom: 10px; position: fixed; }
  .yearstamp { font-size: 96px; }
  .badge { display: none; }
}
</style>
