# least one automated guard. The verify gate runs every guard listed here.
# Fields: id, title, evidence, fixed_in (branch), guards (test file and test name).

- id: F-02-2
  title: One outcome vocabulary; status words never contradict outcomes
  evidence: >
    dan-term 030-hs (staff meeting FAILED while mobilization 85 to 95 applied); marcus-term 010-m1f
    (FAILED on a vote cast and on China/Russia moves); priya-flash 011-ex1 (-9 labelled A step
    forward); maya-phone 018-m4d (front move as "what your choice did"); QA S2-1 (Hormuz USA month 1)
