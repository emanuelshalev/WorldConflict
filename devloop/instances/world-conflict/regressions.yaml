# Findings regression registry (format and checker: devloop/kit/regressions.mjs; decision D-60).
# Every finding a fix addressed, with the code it guards (covers) and at least one automated guard.
# Ids: RS-00N-k = CEO real signal N, point k (in the order of the verbatim); F-0N-k = triage
# cluster of iteration N; QA0-n = iteration 0 QA repro item n; QA1-/QA2-Sx-n = QA verify of
# iteration 1/2, severity and number; B-nn = iteration 1 backlog row.
# UI scenario guards live in scenarios-qa/regressions/ (shared helpers in _lib.mjs; they pin the
# seat to Hormuz Convoy as the United States with a fixed seed unless the repro needs another).
