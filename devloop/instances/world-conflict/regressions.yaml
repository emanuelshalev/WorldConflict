  guards:
    - tests/core/outcome-status.spec.ts > status rules
    - tests/core/outcome-status.spec.ts > every resolved item carries one status
    - tests/ui-outcomes.spec.ts > debrief cards carry the engine's status
    - tests/ui-outcomes.spec.ts > the result card

