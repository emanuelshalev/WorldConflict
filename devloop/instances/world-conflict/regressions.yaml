# Regression registry (devloop/method/triage.md rule 7, D-60): every fixed finding and its guards.
# The verify gate runs every guard; a finding without a passing guard is not fixed.
# guard kinds: unit (vitest file and test name), ui (a script that replays the customer's steps).

- id: F-02-1
  title: Newcomers drown before the first choice (auto-open briefing, text wall, unknown goal, unkind ranking)
  evidence: runs/iter-02/sessions/olivia-laptop.md, runs/iter-02/sessions/noah-phone.md
  fixed_in: fix-newcomers (iteration 3)
  guards:
    - unit: tests/ui-learn.spec.ts "never auto-opens the briefing at any level unless the player turns it on"
    - unit: tests/ui-newcomers.spec.ts "F-02-1: month 1 states the one goal in one plain sentence (Noah)"
    - unit: tests/ui-newcomers.spec.ts "F-02-1: Guide me shows fewer words before the first choice (Olivia, Noah)"
    - unit: tests/ui-numbers.spec.ts "reveal leads with the outcome, the percentile is kind (F-02-1, Olivia)"
    - ui: runs/iter-03/fix-newcomers-shots.mjs (no briefing at Guide me, goal sentence above the crisis, lede at most 16 words, no option descriptions before More, goal line link)

