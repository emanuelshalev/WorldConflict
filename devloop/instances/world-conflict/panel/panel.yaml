# Synthetic customer panel for World Conflict.
# Versioned like code. Every attribute carries an evidence tag:
#   assumed  - written from imagination (weakest)
#   inferred - derived from earlier synthetic rounds or usage logs
#   observed - confirmed by a real person (CEO playtest, real players)
# Change log: every change cites a real signal or a synthetic round (see ../ledger.md).

version: 1.2
updated: 2026-11-21
calibration_sources:
  - id: RS-001
    what: CEO playtest of v0.9.0 (2026-11-21)
    file: ../real-signals/RS-001-ceo-playtest-2026-11-21.md
  - id: RS-000
    what: Real players on an earlier build, reported in the synthetic-customers article
    note: "Most real players played like Maya, not Dan; they were less patient and read less carefully than the personas."

# Coverage matrix (CEO brief 2026-11-21): a wide net, from gamers to people who never play,
# teens to retirees, quick sessions to long campaigns. Every row must be covered by >= 1 archetype.
coverage_axes:
  gaming_experience: [none, casual, high-casual, strategy-veteran, board-games, professional-critic]
  motivation: [fun-and-feel, current-affairs, history-and-what-ifs, learning, depth, drama-to-share]
  age: [teen, 20s, 30s, 40s-50s, 60+]
  session: [quick (10-15 min), long (hour+ or many evenings)]
  device: [phone, tablet, laptop, desktop]
coverage:
  #          gaming            motivation                 age    session  device
  noah:   [high-casual,      fun-and-feel + learning,    teen,  quick,   phone/tablet]
  priya:  [casual,           current-affairs + learning, 20s,   quick,   laptop/tablet]
  leo:    [high-casual,      drama-to-share,             20s,   both,    desktop/phone]
  maya:   [casual,           fun-and-feel,               20s,   quick,   phone/laptop]
  olivia: [casual,           fun-and-feel,               30s,   quick,   laptop/phone]  # early quitter
  sam:    [professional-critic, craft,                   30s,   quick,   desktop/tablet]  # skeptic
  dan:    [strategy-veteran, depth,                      40s,   long,    desktop/laptop]
  marcus: [board-games,      history-and-what-ifs,       50s,   long,    laptop]
  ruth:   [none,             current-affairs + learning, 60+,   long,    tablet/laptop]

# Weights: target market per the CEO brief (broad, many non-gamers), corrected by RS-000
# (most real players behave like Maya) and RS-001 (the CEO reacted like the impatient archetypes).
# Nine archetypes, wider than the method's default 4-6, because the CEO asked for a wide net (D-40).
archetypes:
  - { id: maya,   file: maya.yaml,   weight: 0.18, kind: core }
  - { id: olivia, file: olivia.yaml, weight: 0.13, kind: negative }   # the early quitter
  - { id: ruth,   file: ruth.yaml,   weight: 0.13, kind: core }       # older, non-gamer, current affairs
  - { id: noah,   file: noah.yaml,   weight: 0.10, kind: core }       # teen, mobile gamer
  - { id: priya,  file: priya.yaml,  weight: 0.10, kind: core }
  - { id: dan,    file: dan.yaml,    weight: 0.10, kind: core }
  - { id: sam,    file: sam.yaml,    weight: 0.09, kind: negative }   # the skeptic
  - { id: leo,    file: leo.yaml,    weight: 0.09, kind: core }
  - { id: marcus, file: marcus.yaml, weight: 0.08, kind: core }       # history what-ifs, board gamer

# Each archetype has variants (device, temperament). One variant per archetype plays each
# iteration; variants rotate so the panel covers its spread over several iterations.
variant_rotation: round_robin

# Global calibration from RS-000/RS-001: synthetic players were too patient and read too much.
global_adjustments:
  - attribute: patience
    change: "Every persona abandons a screen after 2 unexplained blocks or ~40 s without knowing what to do."
    evidence: observed
    source: RS-001
  - attribute: reading
    change: "Personas skim: they read headings, button labels and the first line of body text only, unless the archetype says otherwise."
    evidence: observed
    source: RS-000
