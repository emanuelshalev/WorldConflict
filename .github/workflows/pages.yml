# Publishes the landing page (site/) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the public site
        # Internal planning files (copy drafts, launch notes, capture tools) stay private;
        # parallels.json is read by the intro, so it ships.
        run: |
          mkdir -p _site
          rsync -a --exclude 'tools/' --exclude 'content/*.md' --exclude 'README.md' site/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
