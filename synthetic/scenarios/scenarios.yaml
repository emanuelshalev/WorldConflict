# Scenarios in each customer's own words. Version 1.0 (estimated from rounds 1-3 and RS-001).
# Refined after every iteration: add what personas tried that is missing, retire what no one cares about.

maya:
  - {id: M1, goal: "I have 15 minutes on the train. I want to play today's crisis and know at the end whether I did well and why."}
  - {id: M2, goal: "I want to finish a whole Flashpoint without getting stuck on something I don't understand."}
olivia:
  - {id: O1, goal: "My friend sent me this link. I want to start playing right away and have fun in the first two minutes."}
  - {id: O2, goal: "I want to do something big, like make peace or stop a war, and see it happen."}
sam:
  - {id: S1, goal: "I want to judge in five minutes whether this is a crafted game or an AI-made dashboard."}
  - {id: S2, goal: "I want to do the same action from the map and from the menus and see if they work the same."}
dan:
  - {id: D1, goal: "I want to play a full term as a tough country and understand every rule that limits me."}
  - {id: D2, goal: "I want to find the best strategy and check whether there is one move that always wins."}
priya:
  - {id: P1, goal: "I want to play the Ukraine ceasefire crisis as Ukraine and see if the world reacts like the real one."}
  - {id: P2, goal: "I want to understand what each choice is meant to achieve before I take it, and learn what really happened."}
leo:
  - {id: L1, goal: "I'm live on stream. I want the most dramatic run possible and an end screen my chat will love."}
  - {id: L2, goal: "I want to try crazy moves (war, nukes, coups) and either see them happen or get a clear, showable reason why not."}
