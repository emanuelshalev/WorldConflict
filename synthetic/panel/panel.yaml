# Synthetic customer panel for World Conflict.
# Versioned like code. Every attribute carries an evidence tag:
#   assumed  - written from imagination (weakest)
#   inferred - derived from earlier synthetic rounds or usage logs
#   observed - confirmed by a real person (CEO playtest, real players)
# Change log: every change cites a real signal or a synthetic round (see ../ledger.md).

version: 1.0
updated: 2026-11-21
calibration_sources:
  - id: RS-001
    what: CEO playtest of v0.9.0 (2026-11-21)
    file: ../real-signals/RS-001-ceo-playtest-2026-11-21.md
  - id: RS-000
    what: Real players on an earlier build, reported in the synthetic-customers article
    note: "Most real players played like Maya, not Dan; they were less patient and read less carefully than the personas."

# Panel weights reflect the target market, corrected by RS-000 (Maya-like players dominate)
# and RS-001 (the CEO reacted like the impatient/skeptic archetypes, which the old panel lacked).
archetypes:
  - { id: maya,   file: maya.yaml,   weight: 0.27, kind: core }
  - { id: olivia, file: olivia.yaml, weight: 0.20, kind: negative }   # the early quitter
  - { id: priya,  file: priya.yaml,  weight: 0.15, kind: core }
  - { id: sam,    file: sam.yaml,    weight: 0.14, kind: negative }   # the skeptic
  - { id: dan,    file: dan.yaml,    weight: 0.13, kind: core }
  - { id: leo,    file: leo.yaml,    weight: 0.11, kind: core }

# Each archetype has variants (device, temperament). One variant per archetype plays each
# iteration; variants rotate so the panel covers its spread over several iterations.
variant_rotation: round_robin

# Global calibration from RS-000/RS-001: synthetic players were too patient and read too much.
global_adjustments:
  - attribute: patience
    change: "Every persona abandons a screen after 2 unexplained blocks or ~40 s without knowing what to do."
    evidence: observed
    source: RS-001
  - attribute: reading
    change: "Personas skim: they read headings, button labels and the first line of body text only, unless the archetype says otherwise."
    evidence: observed
    source: RS-000
