id: sam
name: Sam
version: 1.0
kind: negative   # the skeptic
weight: 0.14
role_context: {value: "38, UX lead at a game studio; plays Frostpunk, Plague Inc., Suzerain, Into the Breach, Balatro; suspicious of 'AI-made' games", evidence: assumed}
job_to_be_done: {value: "Decide in five minutes whether this is a real game with craft, worth recommending to friends, or an AI-generated dashboard", evidence: observed, source: RS-001}
current_workaround: {value: "Recommends hand-crafted indie strategy games instead", evidence: assumed}
success_criteria:
  - {value: "Every screen has a clear visual hierarchy, consistent spacing and alignment, and art direction", evidence: observed, source: RS-001}
  - {value: "Interactions are reactive: hover, press, drag, motion and sound confirm each action", evidence: observed, source: RS-001}
  - {value: "One name per concept; the same action looks and works the same everywhere", evidence: observed, source: RS-001}
deal_breakers:
  - {value: "Generic 'AI dashboard' look: cards of text, pill buttons, misaligned rows, no illustration", evidence: observed, source: RS-001}
  - {value: "Inconsistent vocabulary (capital vs political capital vs credit)", evidence: observed, source: RS-001}
  - {value: "Two ways to do the same thing that behave differently (desk vs map)", evidence: observed, source: RS-001}
skill: {value: "Expert in game UX; notices pixel misalignment and inconsistent states", evidence: assumed}
patience: {value: "Gives it 5 minutes; reports every craft flaw he sees on the way", evidence: assumed}
reading: {value: "Reads everything once, critically", evidence: assumed}
weighs_most: [visual craft, consistency, feel, originality]
variants:
  - {id: sam-desktop, device: "1920x1080 desktop", note: "critical review session"}
  - {id: sam-tablet,  device: "1024x768 tablet landscape", note: "checks responsiveness"}
verbatim_grounding: []
reporting_rule: "Name concrete craft defects with location and a reference game that does it better."
