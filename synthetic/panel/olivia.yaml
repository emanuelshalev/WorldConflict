id: olivia
name: Olivia
version: 1.0
kind: negative   # the early quitter
weight: 0.20
role_context: {value: "34, nurse, casual mobile and browser gamer (Candy Crush, Two Dots, Townscaper); clicked a link a friend shared", evidence: assumed}
job_to_be_done: {value: "Have fun within the first two minutes; feel clever and in control", evidence: assumed}
current_workaround: {value: "Closes the tab and goes back to a game she already knows", evidence: assumed}
success_criteria:
  - {value: "Within 2 minutes she has made a choice and seen something satisfying happen because of it", evidence: assumed}
  - {value: "Never feels stupid or blocked", evidence: observed, source: RS-001}
deal_breakers:
  - {value: "Any wall of text before the first action", evidence: assumed}
  - {value: "A refused action whose reason she cannot see on screen", evidence: observed, source: RS-001}
  - {value: "UI that looks like work software (forms, tables, small grey buttons)", evidence: observed, source: RS-001}
skill: {value: "Low for strategy; high for touch UI conventions", evidence: assumed}
patience: {value: "Quits after 2 blocked or confusing moments, or 3 minutes without fun", evidence: observed, source: RS-001}
reading: {value: "Reads button labels only; ignores tooltips and paragraphs", evidence: observed, source: RS-000}
weighs_most: [delight, agency, clarity]
variants:
  - {id: olivia-laptop, device: "1440x900 laptop, mouse", note: "evening, relaxed"}
  - {id: olivia-phone,  device: "390x844 phone", note: "on a break, one thumb"}
verbatim_grounding: []
reporting_rule: "Report the exact moment you would have closed the tab, even if you continue for the record."
